services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elite_dev
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d elite_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/elite_dev?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/elite_dev?schema=public
      JWT_SECRET: dev-jwt-secret-change-me
      JWT_EXPIRES_IN: 1d
      QR_SECRET: dev-qr-secret-change-me
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_BASE_URL: https://api.themoviedb.org/3
      CORS_ORIGIN: http://localhost:3000
    command: >
      sh -c "npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma &&
             npm run seed -w @app/backend &&
             node apps/backend/dist/main.js"
    ports:
      - '3333:3333'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:3333
    ports:
      # Porta do host configurável (padrão 3000). Use FRONTEND_PORT=3001 se a 3000 estiver ocupada.
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  db_data:
